why_us:
  - icon: "⚡"
    title: "Đội ngũ kỹ thuật chuyên sâu"
    description: "Kỹ sư nhiều năm kinh nghiệm trong tự động hóa, điện tử và phần mềm công nghiệp, được đào tạo bài bản và liên tục cập nhật công nghệ mới."
  - icon: "🔧"
    title: "Giải pháp tích hợp toàn diện"
    description: "Từ tư vấn, thiết kế, lập trình đến lắp đặt và bảo trì — Nano Power cung cấp trọn gói, giúp doanh nghiệp tối ưu nguồn lực và thời gian."
  - icon: "📊"
    title: "Cam kết tiến độ & chất lượng"
    description: "Quy trình làm việc minh bạch, báo cáo định kỳ và kiểm tra nghiêm ngặt tại từng giai đoạn để đảm bảo sản phẩm đạt tiêu chuẩn cao nhất."
  - icon: "🤝"
    title: "Hỗ trợ sau bàn giao"
    description: "Dịch vụ bảo trì, nâng cấp và hỗ trợ kỹ thuật trực tuyến giúp hệ thống vận hành ổn định trong suốt vòng đời dự án."
